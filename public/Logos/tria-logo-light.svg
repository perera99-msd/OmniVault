<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. Antique Gold Gradient -->
    <linearGradient id="logoGold" x1="120" y1="90" x2="280" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFF4DB" />
      <stop offset="18%" stopColor="#F5D78E" />
      <stop offset="42%" stopColor="#D9AA43" />
      <stop offset="68%" stopColor="#B68527" />
      <stop offset="88%" stopColor="#7D5716" />
      <stop offset="100%" stopColor="#4A3108" />
    </linearGradient>

    <!-- Gold Bevel -->
    <linearGradient id="logoGoldBevel" x1="140" y1="90" x2="240" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.9" />
      <stop offset="50%" stopColor="#ECC875" stopOpacity="0.6" />
      <stop offset="100%" stopColor="#573809" stopOpacity="0.8" />
    </linearGradient>

    <!-- 2. Platinum Titanium Steel Gradient -->
    <linearGradient id="logoSteel" x1="180" y1="90" x2="340" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="18%" stopColor="#E2E8F0" />
      <stop offset="42%" stopColor="#94A3B8" />
      <stop offset="68%" stopColor="#64748B" />
      <stop offset="88%" stopColor="#475569" />
      <stop offset="100%" stopColor="#1E293B" />
    </linearGradient>

    <!-- Steel Bevel -->
    <linearGradient id="logoSteelBevel" x1="200" y1="90" x2="300" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.95" />
      <stop offset="50%" stopColor="#CBD5E1" stopOpacity="0.6" />
      <stop offset="100%" stopColor="#0F172A" stopOpacity="0.8" />
    </linearGradient>

    <!-- 3. Rose Gold / Copper Bronze Gradient -->
    <linearGradient id="logoBronze" x1="150" y1="160" x2="290" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFE7E0" />
      <stop offset="18%" stopColor="#F5B2A0" />
      <stop offset="42%" stopColor="#CF7B66" />
      <stop offset="68%" stopColor="#A85440" />
      <stop offset="88%" stopColor="#7A3222" />
      <stop offset="100%" stopColor="#48180E" />
    </linearGradient>

    <!-- Bronze Bevel -->
    <linearGradient id="logoBronzeBevel" x1="160" y1="170" x2="270" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.9" />
      <stop offset="50%" stopColor="#E29A88" stopOpacity="0.6" />
      <stop offset="100%" stopColor="#3B120B" stopOpacity="0.8" />
    </linearGradient>

    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" floodColor="#000000" floodOpacity="0.25" />
    </filter>

    <filter id="logoOverlapShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" />
      <feOffset dx="1" dy="3.5" result="offsetblur" />
      <feFlood floodColor="#000000" floodOpacity="0.55" />
      <feComposite in2="offsetblur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="logoGoldClip">
      <path d="M 218 90 A 90 90 0 1 0 218 270 A 90 90 0 1 0 218 90 Z M 218 124 A 56 56 0 1 1 218 236 A 56 56 0 1 1 218 124 Z" fillRule="evenodd" />
    </clipPath>

    <clipPath id="logoSteelClip">
      <path d="M 294 90 A 90 90 0 1 0 294 270 A 90 90 0 1 0 294 90 Z M 294 124 A 56 56 0 1 1 294 236 A 56 56 0 1 1 294 124 Z" fillRule="evenodd" />
    </clipPath>

    <clipPath id="logoBronzeClip">
      <path d="M 256 160 A 90 90 0 1 0 256 340 A 90 90 0 1 0 256 160 Z M 256 194 A 56 56 0 1 1 256 306 A 56 56 0 1 1 256 194 Z" fillRule="evenodd" />
    </clipPath>
  </defs>

  <!-- Metallic Knot Symbol -->
  <g filter="url(#logoShadow)">
    <!-- Base Gold Ring (Center: 218, 180) -->
    <circle cx="218" cy="180" r="90" fill="none" stroke="#2B1D04" strokeWidth="3" />
    <circle cx="218" cy="180" r="73" fill="none" stroke="url(#logoGold)" strokeWidth="34" />
    <circle cx="218" cy="180" r="89" fill="none" stroke="url(#logoGoldBevel)" strokeWidth="1.6" />
    <circle cx="218" cy="180" r="57" fill="none" stroke="url(#logoGoldBevel)" strokeWidth="1.6" />

    <!-- Base Steel Ring (Center: 294, 180) -->
    <circle cx="294" cy="180" r="90" fill="none" stroke="#0F172A" strokeWidth="3" />
    <circle cx="294" cy="180" r="73" fill="none" stroke="url(#logoSteel)" strokeWidth="34" />
    <circle cx="294" cy="180" r="89" fill="none" stroke="url(#logoSteelBevel)" strokeWidth="1.6" />
    <circle cx="294" cy="180" r="57" fill="none" stroke="url(#logoSteelBevel)" strokeWidth="1.6" />

    <!-- Base Bronze Ring (Center: 256, 250) -->
    <circle cx="256" cy="250" r="90" fill="none" stroke="#260C07" strokeWidth="3" />
    <circle cx="256" cy="250" r="73" fill="none" stroke="url(#logoBronze)" strokeWidth="34" />
    <circle cx="256" cy="250" r="89" fill="none" stroke="url(#logoBronzeBevel)" strokeWidth="1.6" />
    <circle cx="256" cy="250" r="57" fill="none" stroke="url(#logoBronzeBevel)" strokeWidth="1.6" />

    <!-- Overlap 1: Gold over Steel at Top -->
    <g filter="url(#logoOverlapShadow)" clipPath="url(#logoGoldClip)">
      <circle cx="218" cy="180" r="73" fill="none" stroke="url(#logoGold)" strokeWidth="34" />
      <circle cx="218" cy="180" r="89" fill="none" stroke="url(#logoGoldBevel)" strokeWidth="1.6" />
      <circle cx="218" cy="180" r="57" fill="none" stroke="url(#logoGoldBevel)" strokeWidth="1.6" />
    </g>

    <!-- Overlap 2: Steel over Bronze at Right -->
    <g filter="url(#logoOverlapShadow)" clipPath="url(#logoSteelClip)">
      <circle cx="294" cy="180" r="73" fill="none" stroke="url(#logoSteel)" strokeWidth="34" />
      <circle cx="294" cy="180" r="89" fill="none" stroke="url(#logoSteelBevel)" strokeWidth="1.6" />
      <circle cx="294" cy="180" r="57" fill="none" stroke="url(#logoSteelBevel)" strokeWidth="1.6" />
    </g>

    <!-- Overlap 3: Bronze over Gold at Left -->
    <g filter="url(#logoOverlapShadow)" clipPath="url(#logoBronzeClip)">
      <circle cx="256" cy="250" r="73" fill="none" stroke="url(#logoBronze)" strokeWidth="34" />
      <circle cx="256" cy="250" r="89" fill="none" stroke="url(#logoBronzeBevel)" strokeWidth="1.6" />
      <circle cx="256" cy="250" r="57" fill="none" stroke="url(#logoBronzeBevel)" strokeWidth="1.6" />
    </g>
  </g>

  <!-- Typography -->
  <text x="256" y="410" text-anchor="middle" font-family="'Cinzel', 'Trajan Pro', Georgia, serif" font-size="44" font-weight="700" letter-spacing="8" fill="#1A1D1A">TRIA</text>
  <text x="256" y="442" text-anchor="middle" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="700" letter-spacing="4.5" fill="#6C5B4C">PERSONAL FINANCE</text>
  <text x="256" y="468" text-anchor="middle" font-family="'Outfit', 'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#987B5E">Wealth | Income | Expenses</text>
</svg>
