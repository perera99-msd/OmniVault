name: OmniVault CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev-dimalsha" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Type Check & Lint
      run: npm run lint

    - name: Build Next.js App
      run: npm run build
      
  docker-build:
    name: Build Docker Image
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Build Docker Image
      run: docker build -t omnivault-pwa:latest .
      
